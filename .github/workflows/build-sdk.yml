# =============================================================================
# Build, verify and release the DevBridge Go SDK — industry-standard pipeline.
#
# Release model (follows common Go SDK practice):
#   - The module github.com/17673651504/devspace-devbridge/go-sdk lives in
#     ./go-sdk, so release tags MUST be `go-sdk/vX.Y.Z` (Go module proxy rule
#     for subdirectory modules). The proxy indexes the tag on push; no extra
#     object is required for `go get` to work.
#   - Version is strict SemVer: v0.2.0, v0.2.0-rc.1, v0.2.0-beta.1, ...
#     Invalid versions are rejected BEFORE anything is published, because tags
#     are immutable and the module proxy caches a bad tag forever.
#   - Quality gates (build job) must pass before publish:
#     gofmt, go mod tidy, go build, go vet, go test -race, govulncheck.
#   - GitHub Release is a convenience archive (source tar.gz + checksums) with
#     auto-generated changelog from conventional commits. Stable versions
#     (v0.2.3) are published as NORMAL releases, so they show in the Releases
#     main list; pre-release versions (-alpha/-beta/-rc.N) keep the prerelease
#     flag per SemVer convention. EVERY SDK release passes --latest=false, so
#     it never steals this repo's `releases/latest` from the CLI
#     (README / install.sh / updater.go all use releases/latest/download/).
#     On GitCode the upload passes --no-latest, so the rolling `latest` Release
#     (maintained by the shared upload script for the CLI on
#     CloudDeveloperDepartment/devbrige) is left untouched.
#   - After publish, the verify job proves the module resolves from the tag
#     (GOPROXY=direct go list -m), only when run in the canonical repo
#     (huaweicloud/devspace-devbridge) that matches the module path.
#
# Triggers:
#   pull_request            PR touching go-sdk/**        (CI only)
#   push (branches)         develop/master under go-sdk/** (CI only)
#   push (tags go-sdk/v*)   release tag -> CI + publish
#   workflow_dispatch       manual: input.version -> CI + publish same version
#
# Version resolution:
#   workflow_dispatch -> input.version (strip any go-sdk//sdk/ prefix)
#   tag push          -> tag name with prefix stripped
#   publish-github always releases on tag `go-sdk/{version}`, so the tag,
#   the GitHub Release and the source archive carry the SAME version.
#
# Notes:
#   - Tags are immutable once pushed (module proxy caches them forever).
#   - Re-running a dispatch with an already-released version fails with 422;
#     bump the version instead.
# =============================================================================
name: Build SDK

on:
  pull_request:
    branches: [develop, main, master]
    paths:
      - "go-sdk/**"
      - ".github/workflows/build-sdk.yml"
  push:
    branches: [develop, main, master]
    paths:
      - "go-sdk/**"
      - ".github/workflows/build-sdk.yml"
    tags:
      - "go-sdk/v*"
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 vX.Y.Z 或 go-sdk/vX.Y.Z（支持 v0.2.0-rc.1 等预发布；会创建相同版本号的 GitHub Release；留空则只跑 CI 不发布）'
        required: false
        default: ''

# 顶层默认只读；publish-github 单独提升为 contents: write。
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # CI: quality gates. 通过后才允许发布。
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Use the Go version declared in go.mod.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-sdk/go.mod
          cache-dependency-path: go-sdk/go.sum

      - name: Format check (gofmt)
        working-directory: go-sdk
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "❌ 以下文件需要 gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "✓ gofmt 通过"

      - name: Tidy check (go.mod / go.sum)
        working-directory: go-sdk
        run: |
          cp go.mod /tmp/go.mod.orig
          cp go.sum /tmp/go.sum.orig
          go mod tidy
          if ! diff -u /tmp/go.mod.orig go.mod || ! diff -u /tmp/go.sum.orig go.sum; then
            echo "❌ go.mod / go.sum 不是 tidy 状态，请先运行 go mod tidy 再提交"
            exit 1
          fi
          echo "✓ go.mod / go.sum 已 tidy"

      - name: Build
        working-directory: go-sdk
        run: go build ./...

      - name: Vet
        working-directory: go-sdk
        run: go vet ./...

      - name: Test (race)
        working-directory: go-sdk
        run: go test -race -count=1 ./...

      - name: Vulnerability scan (govulncheck)
        working-directory: go-sdk
        env:
          # 用当前稳定版工具链(go1.26.8)扫描，标准库漏洞检查才是有效的：
          # go1.22 早已 EOL，旧补丁上的 stdlib 漏洞永远不会被修复，扫必挂。
          # SDK 自身的 go 1.22.0 最低版本声明不变，不影响下游使用者。
          GOTOOLCHAIN: go1.26.8
        # 固定 v1.1.4：与 go 1.22 兼容；@latest(v1.8+) 要求 go >= 1.26 会直接失败。
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  # ---------------------------------------------------------------------------
  # Package: 解析并校验版本号，打包源码（tar.gz + checksums）。
  # ---------------------------------------------------------------------------
  package:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/go-sdk/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      prev_release_tag: ${{ steps.resolve.outputs.prev_release_tag }}
    steps:
      - name: Checkout (full history, for previous-tag discovery)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ inputs.version }}"
          else
            RAW_VERSION="${GITHUB_REF_NAME}"
          fi
          # 统一去前缀：go-sdk/v0.2.1 -> v0.2.1（兼容手抖输入的 sdk/v0.2.1）
          NORMALIZED="$(printf '%s' "$RAW_VERSION" | sed -E 's#^(go-sdk|sdk)/##')"
          # 严格 SemVer：vX.Y.Z / vX.Y.Z-rc.1 / vX.Y.Z+build。拒绝 v0.2、0.2.0、release 等非法值
          if ! printf '%s' "$NORMALIZED" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "❌ 非法版本号: '$NORMALIZED'（必须是 SemVer，例如 v0.2.0 或 go-sdk/v0.2.0-rc.1）"
            exit 1
          fi
          # 供发布步骤使用；prev_release_tag 用于限制 changelog 范围（无则留空）
          PREV="$(git tag --list 'go-sdk/v*' --sort=-v:refname | sed -n 2p)"
          echo "version=${NORMALIZED}" >> "$GITHUB_OUTPUT"
          echo "release_tag=go-sdk/${NORMALIZED}" >> "$GITHUB_OUTPUT"
          echo "prev_release_tag=${PREV}" >> "$GITHUB_OUTPUT"
          echo "  版本号: ${NORMALIZED}"
          echo "  Release tag: go-sdk/${NORMALIZED}"
          echo "  上一个 SDK tag: ${PREV:-（无，changelog 取全部历史）}"

      - name: Check go.mod for replace directives
        working-directory: go-sdk
        run: |
          if grep -Eq '^replace ' go.mod; then
            echo "❌ go.mod 含 replace 指令，模块代理无法索引，发布前必须移除"
            exit 1
          fi
          echo "✓ go.mod 无 replace"

      - name: Package SDK source
        run: |
          mkdir -p dist
          # HEAD:go-sdk —— tag 触发时是 tag 提交；dispatch 触发时是当前分支最新提交
          git archive --format=tar.gz \
            --prefix="devbridge-go-sdk-${{ steps.resolve.outputs.version }}/" \
            --output="dist/devbridge-go-sdk-${{ steps.resolve.outputs.version }}.tar.gz" \
            HEAD:go-sdk
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          echo "打包产物:"
          ls -la dist

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdk-package-${{ steps.resolve.outputs.version }}
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish: GitHub Release（稳定版正常展示 + --latest=false + 自动 changelog）。
  # ---------------------------------------------------------------------------
  publish-github:
    runs-on: ubuntu-latest
    needs: package
    concurrency:
      group: sdk-release-${{ needs.package.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout (full history, for changelog generation)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: sdk-package-${{ needs.package.outputs.version }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.package.outputs.version }}"
          TAG="${{ needs.package.outputs.release_tag }}"
          PREV="${{ needs.package.outputs.prev_release_tag }}"
          # 手动触发时 tag 尚不存在，gh 会自动在指定提交上创建该 tag；
          # push tag 触发时 tag 已存在，直接挂到上面。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.sha }}"
          else
            TARGET=""
          fi
          # 自动 changelog：从上一个 go-sdk tag 到本次，按 Conventional Commits 分组
          if [ -n "$PREV" ]; then
            GEN_NOTES="--generate-notes --notes-start-tag ${PREV}"
          else
            GEN_NOTES="--generate-notes"
          fi
          # 语义化发布：
          #   - 稳定版 (v0.2.3)        → 普通 release，出现在 Releases 主列表 ✓
          #   - 预发布版 (v0.2.3-alpha) → 按 SemVer 惯例标 prerelease（折叠展示）
          # 两者都加 --latest=false：显式不抢 CLI 的 releases/latest。
          if printf '%s' "$VERSION" | grep -q -- '-'; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi
          gh release create "${TAG}" \
            ${TARGET:+--target "${TARGET}"} \
            --title "devbridge-go-sdk ${VERSION}" \
            ${GEN_NOTES} \
            ${PRERELEASE_FLAG} \
            --latest=false \
            "dist/devbridge-go-sdk-${VERSION}.tar.gz" \
            "dist/checksums.txt"
          echo "✓ GitHub Release 已创建: ${TAG}"

      - name: Verify release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ needs.package.outputs.release_tag }}" \
            --json tagName,isPrerelease,assets \
            --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[].name]}'

  # ---------------------------------------------------------------------------
  # Mirror: GitCode 源码镜像（保持该仓库原有约定，消费 package 产物）。
  # ---------------------------------------------------------------------------
  publish-gitcode:
    runs-on: ubuntu-latest
    needs: package
    concurrency:
      group: sdk-release-${{ needs.package.outputs.version }}
      cancel-in-progress: false
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_SDK_OWNER: ${{ vars.GITCODE_SDK_OWNER }}
      GITCODE_SDK_REPO: ${{ vars.GITCODE_SDK_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: sdk-package-${{ needs.package.outputs.version }}
          path: dist

      - name: Upload to GitCode Release
        run: |
          if [ -z "${GITCODE_TOKEN:-}" ]; then
            echo "⚠️  未配置 GITCODE_TOKEN，跳过 GitCode 上传"
            exit 0
          fi
          ./cli/scripts/upload-gitcode-release.sh \
            --no-latest \
            -t "$GITCODE_TOKEN" \
            -o "${GITCODE_SDK_OWNER:-CloudDeveloperDepartment}" \
            -r "${GITCODE_SDK_REPO:-devbridge-go-sdk}" \
            -v "${{ needs.package.outputs.version }}" \
            -d ./dist \
            -n "devbridge-go-sdk ${{ needs.package.outputs.version }}" \
            -b "DevBridge Go SDK ${{ needs.package.outputs.version }} - 源码同步自 GitHub Release"

  # ---------------------------------------------------------------------------
  # Verify: 发布后验证模块可从 tag 拉取（仅规范仓库；fork 上模块路径不一致，跳过）。
  # ---------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    needs: [package, publish-github]
    if: github.repository == 'huaweicloud/devspace-devbridge'
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-sdk/go.mod
          cache-dependency-path: go-sdk/go.sum

      - name: Verify module resolves from published tag
        working-directory: go-sdk
        run: |
          VERSION="${{ needs.package.outputs.version }}"
          echo "验证: GOPROXY=direct go list -m github.com/17673651504/devspace-devbridge/go-sdk@${VERSION}"
          GOPROXY=direct go list -m "github.com/17673651504/devspace-devbridge/go-sdk@${VERSION}"
          echo "✓ 模块可从 tag 解析，go get 可用"