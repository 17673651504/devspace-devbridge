# =============================================================================
# Build and verify the DevBridge Go SDK.
#
# Release is a plain tag push (e.g. go-sdk/v0.1.0); the Go module proxy
# (proxy.golang.org / goproxy.cn) indexes it automatically. This workflow only
# verifies the SDK builds, vets, and tests cleanly.
#
# Triggers:
#   pull_request          PR touching go-sdk/**
#   push (branches)       develop/master changes under go-sdk/**
#   push (tags go-sdk/v*) SDK release tag
#   workflow_dispatch     manual
#
# Notes:
#   - The SDK lives in a subdirectory; release tags must use the go-sdk/ prefix.
#   - Tags are immutable once pushed (the module proxy caches them forever).
#
# GitCode source archive (publish-gitcode job):
#   Packs go-sdk/ source into a tar.gz + checksums.txt and uploads it to a
#   GitCode Release via cli/scripts/upload-gitcode-release.sh, as a manual
#   download mirror alongside the Go module proxy.
#   Requires:
#     secrets.GITCODE_TOKEN   GitCode token (upload skipped when unset)
#     vars.GITCODE_SDK_OWNER  GitCode owner (default CloudDeveloperDepartment)
#     vars.GITCODE_SDK_REPO   GitCode repo (default devbridge-go-sdk; keep it
#                             separate from the CLI repo to avoid tag clashes)
#   GitCode tag = version without the go-sdk/ prefix (go-sdk/v0.2.1 → v0.2.1).
# =============================================================================
name: Build SDK

on:
  pull_request:
    branches: [develop, main, master]
    paths:
      - "go-sdk/**"
      - ".github/workflows/build-sdk.yml"
  push:
    branches: [develop, main, master]
    paths:
      - "go-sdk/**"
      - ".github/workflows/build-sdk.yml"
    tags:
      - "go-sdk/v*"
  workflow_dispatch:
    inputs:
      version:
        description: '手动测试发布时的版本号（如 v0.2.0-test.1，留空则跳过发布）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Use the Go version declared in go.mod.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-sdk/go.mod
          cache-dependency-path: go-sdk/go.sum

      - name: Build
        working-directory: go-sdk
        run: go build ./...

      - name: Vet
        working-directory: go-sdk
        run: go vet ./...

      - name: Test
        working-directory: go-sdk
        run: go test ./...

  # On SDK release, archive the source to GitCode as a manual download mirror.
  publish-gitcode:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/go-sdk/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    permissions:
      contents: read
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_SDK_OWNER: ${{ vars.GITCODE_SDK_OWNER }}
      GITCODE_SDK_REPO: ${{ vars.GITCODE_SDK_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Package SDK source
        run: |
          # tag: go-sdk/v0.2.1 -> v0.2.1 ; manual dispatch uses inputs.version
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SDK_VERSION="${{ inputs.version }}"
          else
            SDK_VERSION="${GITHUB_REF_NAME#go-sdk/}"
          fi
          echo "SDK_VERSION=${SDK_VERSION}" >> "$GITHUB_ENV"
          mkdir -p dist
          git archive --format=tar.gz --prefix="devbridge-go-sdk-${SDK_VERSION}/" \
            --output="dist/devbridge-go-sdk-${SDK_VERSION}.tar.gz" HEAD:go-sdk
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          echo "打包产物:"
          ls -la dist

      - name: Upload to GitCode Release
        run: |
          if [ -z "${GITCODE_TOKEN:-}" ]; then
            echo "⚠️  未配置 GITCODE_TOKEN，跳过 GitCode 上传"
            exit 0
          fi
          ./cli/scripts/upload-gitcode-release.sh \
            -t "$GITCODE_TOKEN" \
            -o "${GITCODE_SDK_OWNER:-CloudDeveloperDepartment}" \
            -r "${GITCODE_SDK_REPO:-devbridge-go-sdk}" \
            -v "$SDK_VERSION" \
            -d ./dist \
            -n "devbridge-go-sdk ${SDK_VERSION}" \
            -b "DevBridge Go SDK ${SDK_VERSION} - 源码同步自 GitHub Release"