# =============================================================================
# Build and verify the DevBridge Go SDK.
#
# Release is a plain tag push (e.g. go-sdk/v0.1.0); the Go module proxy
# (proxy.golang.org / goproxy.cn) indexes it automatically. This workflow only
# verifies the SDK builds, vets, and tests cleanly, and mirrors the release tag
# to the GitCode mirror repo.
#
# Triggers:
#   pull_request          PR touching go-sdk/**
#   push (branches)       develop/master changes under go-sdk/**
#   push (tags go-sdk/v*) SDK release tag
#   workflow_dispatch     manual
#
# Notes:
#   - The SDK lives in a subdirectory; release tags must use the go-sdk/ prefix.
#   - Tags are immutable once pushed (the module proxy caches them forever).
#
# Tag mirroring (sync-tag job):
#   Pushes the same tag (e.g. go-sdk/v0.2.1) to the GitCode mirror repo
#   CloudDeveloperDepartment/devbrige, which mirrors this repository in full.
#   Requires secrets.GITCODE_TOKEN (skipped when unset).
# =============================================================================
name: Build SDK

on:
  pull_request:
    branches: [develop, main, master]
    paths:
      - "go-sdk/**"
      - ".github/workflows/build-sdk.yml"
  push:
    branches: [develop, main, master]
    paths:
      - "go-sdk/**"
      - ".github/workflows/build-sdk.yml"
    tags:
      - "go-sdk/v*"
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 go-sdk/v0.2.1，留空则仅构建）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Use the Go version declared in go.mod.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-sdk/go.mod
          cache-dependency-path: go-sdk/go.sum

      - name: Build
        working-directory: go-sdk
        run: go build ./...

      - name: Vet
        working-directory: go-sdk
        run: go vet ./...

      - name: Test
        working-directory: go-sdk
        run: go test ./...

  # Mirror the SDK release tag to the GitCode mirror repo (devbrige) so the same
  # version exists there. The source itself is mirrored to GitCode separately.
  sync-tag:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/go-sdk/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push tag to GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if [ -z "${GITCODE_TOKEN:-}" ]; then
            echo "GITCODE_TOKEN not set, skipping tag sync"
            exit 0
          fi
          TAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          git tag "${TAG}" HEAD
          git push "https://oauth2:${GITCODE_TOKEN}@gitcode.com/CloudDeveloperDepartment/devbrige.git" \
            "refs/tags/${TAG}:refs/tags/${TAG}"
          echo "synced tag ${TAG} to GitCode"