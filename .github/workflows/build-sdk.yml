# =============================================================================
# Build and Verify DevBridge Go SDK
#
# SDK 的"发布"方式：打 tag 推送到 origin（如 go-sdk/v0.1.0），
# Go module proxy（proxy.golang.org / goproxy.cn）会自动收录该版本。
# 本 workflow 负责在 tag 推送和日常变更时校验 SDK 可编译、可测试。
#
# 触发:
#   pull_request          修改 go-sdk/** 时自动校验
#   push (branches)       develop/master 分支 go-sdk/** 变更时校验
#   push (tags go-sdk/v*)    SDK 发版 tag 推送时做发布前校验
#   workflow_dispatch     手动触发
#
# 注意:
#   - SDK 位于子目录，发版 tag 必须带 go-sdk/ 前缀（如 go-sdk/v0.1.0）
#   - tag 一旦推送不可移动或删除（Go module proxy 永久缓存）
#
# GitCode 源码归档同步（publish-gitcode 任务）:
#   - 仅在 go-sdk/v* tag 触发时打包 go-sdk/ 源码 tar.gz + checksums.txt，
#     通过复用 cli/scripts/upload-gitcode-release.sh 上传到 GitCode Release。
#   - 需要配置：
#       secrets.GITCODE_TOKEN      GitCode 访问令牌（未配置则跳过上传）
#       vars.GITCODE_SDK_OWNER     GitCode SDK 仓库 owner（默认 CloudDeveloperDepartment）
#       vars.GITCODE_SDK_REPO      GitCode SDK 仓库名（默认 devbridge-go-sdk，建议独立仓，避免与 CLI 分发仓 tag 冲突）
#   - GitCode Release tag 使用去前缀后的版本号（如 go-sdk/v0.2.1 → v0.2.1）。
# =============================================================================
name: Build SDK

on:
  pull_request:
    branches: [develop, main, master]
    paths:
      - "go-sdk/**"
      - ".github/workflows/build-sdk.yml"
  push:
    branches: [develop, main, master]
    paths:
      - "go-sdk/**"
      - ".github/workflows/build-sdk.yml"
    tags:
      - "go-sdk/v*"
  workflow_dispatch:
    inputs:
      version:
        description: '手动测试发布时的版本号（如 v0.2.0-test.1，留空则跳过发布）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 用 go.mod 声明的版本（最低承诺的 Go 版本）做校验
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-sdk/go.mod
          cache-dependency-path: go-sdk/go.sum

      - name: Build
        working-directory: go-sdk
        run: go build ./...

      - name: Vet
        working-directory: go-sdk
        run: go vet ./...

      - name: Test
        working-directory: go-sdk
        run: go test ./...

  # ---- SDK 发版时，把源码包同步归档到 GitCode Release ----
  # 采用"源码 tar.gz + checksums.txt"方式（方案 B），与 Go module proxy 分发并行，
  # 便于无法访问 GitHub 的环境从 GitCode 手动下载源码归档。复用 CLI 的通用上传脚本。
  publish-gitcode:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/go-sdk/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    permissions:
      contents: read
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_SDK_OWNER: ${{ vars.GITCODE_SDK_OWNER }}
      GITCODE_SDK_REPO: ${{ vars.GITCODE_SDK_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Package SDK source
        run: |
          # tag: go-sdk/v0.2.1 -> v0.2.1 ; 手动触发用 inputs.version
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SDK_VERSION="${{ inputs.version }}"
          else
            SDK_VERSION="${GITHUB_REF_NAME#go-sdk/}"
          fi
          echo "SDK_VERSION=${SDK_VERSION}" >> "$GITHUB_ENV"
          mkdir -p dist
          git archive --format=tar.gz --prefix="devbridge-go-sdk-${SDK_VERSION}/" \
            --output="dist/devbridge-go-sdk-${SDK_VERSION}.tar.gz" HEAD:go-sdk
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          echo "打包产物:"
          ls -la dist

      - name: Upload to GitCode Release
        run: |
          if [ -z "${GITCODE_TOKEN:-}" ]; then
            echo "⚠️  未配置 GITCODE_TOKEN，跳过 GitCode 上传"
            exit 0
          fi
          ./cli/scripts/upload-gitcode-release.sh \
            -t "$GITCODE_TOKEN" \
            -o "${GITCODE_SDK_OWNER:-CloudDeveloperDepartment}" \
            -r "${GITCODE_SDK_REPO:-devbridge-go-sdk}" \
            -v "$SDK_VERSION" \
            -d ./dist \
            -n "devbridge-go-sdk ${SDK_VERSION}" \
            -b "DevBridge Go SDK ${SDK_VERSION} - 源码同步自 GitHub Release"
